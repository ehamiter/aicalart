[project]
name = "aicalart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.18.0",
    "colorama==0.4.6",
    "python-dotenv==1.2.2",
    "gnews==0.4.3",
    "dnspython>=2.6.1",
    "google-api-python-client==2.132.0",
    "google-auth-oauthlib==1.2.0",
    "openai==1.31.2",
    "pillow==12.2.0",
    "requests==2.33.0",
    "holidays>=0.87",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
